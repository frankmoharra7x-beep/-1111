<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人项目空间</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101522;
    color: #edf2ff;
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 35px 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    padding: 65px 10px 45px;
}

.tag {
    color: #70baff;
    font-size: 13px;
    letter-spacing: 3px;
}

h1 {
    font-size: 36px;
    margin: 20px 0;
}

.subtitle {
    color: #9ba8bf;
    line-height: 2;
}

.section-title {
    margin: 25px 0;
    font-size: 20px;
}

.card {
    background: #1b2537;
    border: 1px solid #303d54;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 18px;
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #70baff;
}

.card h2 {
    font-size: 19px;
    margin-bottom: 12px;
}

.card p {
    color: #aab6ca;
    line-height: 1.8;
    font-size: 14px;
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 11px 22px;
    background: #477fe9;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
}

.footer {
    color: #64728b;
    text-align: center;
    margin-top: 70px;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

<header class="header">
    <div class="tag">PERSONAL PROJECT SPACE</div>
    <h1>项目展示空间</h1>
    <p class="subtitle">
        记录技术探索与实践。<br>
        专注于智能化、数字化与创新设计。
    </p>
</header>

<h2 class="section-title">项目 / PROJECTS</h2>

<div class="card">
    <h2>01. 机场行李无人化装仓仿真</h2>
    <p>
        面向航空行李装载场景，探索自动化装载、
        机械臂协同与智能化作业方案。
    </p>
    <a class="button"
       href="机场行李无人化装仓仿真.html">
       进入项目 →
    </a>
</div>

<div class="card">
    <h2>02. 行李装载优化系统</h2>
    <p>
        基于算法进行行李装载方案计算与优化，
        探索机场行李物流的智能化规划。
    </p>
    <a class="button"
       href="行李装载优化系统.html">
       进入项目 →
    </a>
</div>

<footer class="footer">
    PERSONAL PROJECT SPACE · 2026
</footer>

</div>
</body>
</html>
